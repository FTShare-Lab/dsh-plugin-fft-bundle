packages:
  - packages/*
# 开发宿主版本只在这里钉一次。宿主包（@deepseek-ai/*）是本仓编译期的类型来源，
# 运行期由 DSH 提供：插件包用 peerDependencies 声明契约，用 devDependencies +
# catalog 取开发用的那一份；autoInstallPeers 装进来的传递 peer 闭包由 overrides
# 钉版本。三者必须同版。
#
# 为什么钉 overrides：宿主包大量用开放下界（>=0.2.x）声明 peer，不钉的话任何
# peer 变更（例如 ami 0.4.2 新增 0.2.1 的 compaction/jobs 依赖）都会让 pnpm 把
# 闭包重解析到 npm 最新版，dev 树整体漂移、出现同名包两份与非移植类型。
# 宿主升级 = 改 catalog + overrides、改 `dsh.engines.dsh` 下限、改 ami 的
# PROVENANCE 基线宿主，然后全量重装；`tests/host-pins.test.mjs` 守一致性。
autoInstallPeers: true
catalog:
  '@deepseek-ai/cordis': 4.0.4
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-settings': 0.2.1-rc.2
  '@deepseek-ai/dsh-client-ui-slots': 0.2.1-rc.2
  '@deepseek-ai/dsh-command-compact': 0.2.1-rc.2
  '@deepseek-ai/dsh-commands': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction-basic': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction-tool-result-pruner': 0.2.1-rc.2
  '@deepseek-ai/dsh-compaction-image-offload': 0.2.1-rc.2
  '@deepseek-ai/dsh-credentials': 0.2.1-rc.2
  '@deepseek-ai/dsh-llm': 0.2.1-rc.2
  '@deepseek-ai/dsh-llm-retry': 0.2.1-rc.2
  '@deepseek-ai/dsh-tools': 0.2.1-rc.2
  '@deepseek-ai/schemastery': 3.18.5
# pnpm 默认拒装刚发布的版本；本仓钉的正是自己刚发的那一版，放行。
minimumReleaseAgeExclude:
  - '@dsh-ft/dsh-fft-paper-trading@0.6.0'
  - '@dsh-ft/dsh-fft-paper-trading@0.6.2'
  - '@dsh-ft/dsh-fft-paper-trading@0.6.3'
  - '@dsh-ft/dsh-fft-settings@0.5.1'
  - '@dsh-ft/dsh-fft-settings@0.6.0'
  - '@dsh-ft/dsh-fft-ftshare@0.4.1'
  - '@dsh-ft/dsh-fft-plot@0.1.0'
  - '@dsh-ft/dsh-fft-settings@0.7.0'
  - '@dsh-ft/dsh-fft-ftshare@0.4.2'
  - '@dsh-ft/dsh-fft-paper-trading@0.7.0'
overrides:
  # 宿主闭包：钉到 thirdparty/deepseek-harness 那一版（0.2.1-rc.2；dsh-invariants
  # 没有该版本，冻结在 0.2.0-rc.2）。新增宿主 peer 若未钉版本，会解析到 npm 最新版，
  # host-pins 测试会失败，按报错补一行即可。
  '@deepseek-ai/cordis': 4.0.4
  '@deepseek-ai/cordis-plugin-group': 1.0.5
