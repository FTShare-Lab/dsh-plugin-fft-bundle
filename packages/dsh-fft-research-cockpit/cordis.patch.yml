# dsh-fft-research-cockpit bundle patch
#
# `dsh.bundle.patch` layer of the published package. It carries two rows on
# purpose, because the two installation paths need different planes:
#
#   * through the composition bundle `@ft/dsh-fft-bundle` — that patch inserts
#     the bare-name carrier row globally and mounts this package's `/agent`
#     entry from `preset-ft-finance`; DO NOT add this package separately, or
#     the tool row lands twice (see README).
#   * standalone (`dsh plugin --profile <name> add @ft/dsh-fft-research-cockpit`)
#     — there is no preset, so both rows go on the global plane:
#
#       - the bare package name is the carrier: it is the only kind of row
#         DSH's browser module scan can see (the scan walks the ROOT loader's
#         entries), which is what composes the report card, the session
#         "报告" view and the sidebar tab. It must not declare `inject`, or the
#         row would wait for services and never get a fiber to be scanned;
#       - `/agent` registers the ten `cockpit_*` tools. A subpath row never
#         produces a browser module source, so it cannot double-register the
#         browser half.
- insert:
    - id: ft-research-cockpit
      name: '@ft/dsh-fft-research-cockpit'
    - id: ft-research-cockpit-tools
      name: '@ft/dsh-fft-research-cockpit/agent'
