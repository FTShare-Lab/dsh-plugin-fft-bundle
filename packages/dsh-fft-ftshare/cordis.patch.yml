# dsh-fft-ftshare bundle patch
#
# `dsh.bundle.patch` layer of the published package. It carries four rows on
# purpose, because the two installation paths need different planes:
#
#   * through the composition bundle `@ft/dsh-fft-bundle` — that patch inserts
#     the bare-name provider row globally (a `provide` cannot live in a preset)
#     and mounts this package's `/tools`, `/mask` and `/project` entries from
#     `preset-ft-finance`; DO NOT add this package separately, or every row
#     lands twice (see README).
#   * standalone (`dsh plugin --profile <name> add @dsh-ft/dsh-fft-ftshare`) —
#     there is no preset, so all four rows go on the global plane: the tools and
#     the mask apply to every agent, and the projection hook covers every MCP
#     result.
#
# The bare package name is the only row that provides the service. This package
# declares no `dsh.client`, so a bare-name row never composes a browser module
# source and the client half-plane question does not arise.
- insert:
    - id: dsh-fft-ftshare
      name: '@dsh-ft/dsh-fft-ftshare'
    - id: ft-ftshare-tools
      name: '@dsh-ft/dsh-fft-ftshare/tools'
    - id: ft-ftshare-mask
      name: '@dsh-ft/dsh-fft-ftshare/mask'
    - id: ft-ftshare-project
      name: '@dsh-ft/dsh-fft-ftshare/project'
