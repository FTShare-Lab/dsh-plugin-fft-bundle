# dsh-fft-bundle patch layer: inserts the FT workbench plugin rows with their
# shared defaults. Applied when this package is installed via
#
#   dsh plugin --profile <name> add @ft/dsh-fft-bundle
#
# Each row's package comes from this bundle's dependencies. The connection
# row from dsh-web-app is NOT overridden: the connection plugin already waits
# for webServer internally, and pinning its activation to webServer would
# break profiles that only provide webRuntime.
#
# Row order follows the service direction: the shared settings service is
# inserted first because the research cockpit injects `ftshareSettings`.
#
# The NewAPI row carries the deployment's public URLs, because this layer is
# the only one that reaches every install: the plugin reads its config once at
# startup, and the other sources are per-machine (a profile patch or
# `$DSH_HOME/cordis.patch.yml`) or the desktop installer's settings.yaml
# template — copied only when that file is absent and imported once on DSH 0.2,
# so existing users and fresh profiles never receive it. A later profile patch
# still overrides this row wholesale.
- insert:
    - id: dsh-fft-settings
      name: '@ft/dsh-fft-settings'
    - id: ft-research-cockpit
      name: '@ft/dsh-fft-research-cockpit'
    - id: newapi-wechat-sso
      name: '@ft/dsh-newapi-wechat-sso'
      config:
        baseUrl: https://llm-proxy.ftai.chat
        redirectUri: https://llm-proxy.ftai.chat/oauth/ft-sso
