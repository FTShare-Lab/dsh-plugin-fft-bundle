# dsh-fft-bundle patch layer: inserts the FT workbench plugin rows with their
# shared defaults. Applied when this package is installed via
#
#   dsh plugin --profile <name> add @ft/dsh-fft-bundle
#
# Two planes:
#   * the host rows (settings service, SSO, kline sidebar) stay global — a
#     service provider cannot be mounted from a preset, and client halves live
#     in the profile's browser module graph;
#   * everything that is only true in the finance working mode goes into
#     `preset-ft-finance`: the FT persona, the prompt contract entry, the
#     kline MCP client, the report tools and the factor skill. That preset
#     copies the official `standard` composition, because a preset's `plugins`
#     list is complete and inherits nothing.
#
# The report tools are split across those two planes on purpose. DSH composes
# the browser module graph from the ROOT loader's entries only, and a preset
# mounts its rows in a detached subtree that never appears there, so the
# cockpit's browser half is carried by the bare-name row below while its
# tool registrations stay in the preset on the `/agent` subpath entry (a
# subpath row produces no browser module source, so nothing double-registers).
#
# The preset's tool and skill registrations are scoped to the preset subtree,
# so the standard mode keeps none of them. That is what keeps `ftshare_*` and
# the projection hook out of the standard mode: the FTShare service row is
# global because a `provide` cannot live in a preset, while everything that
# registers a tool or a hook is mounted from `preset-ft-finance`.
#
# Last: make `ft-finance` the default new-session preset. The registry resolves
# `selectedDefault` first, but that field is volatile and never reaches disk, so
# the durable default is this row's `default`. Overriding the row replaces its
# whole config — the official row carries only `default` today, and
# `tests/preset-ft-finance.test.mjs` fails if that changes.

- insert:
    - id: dsh-fft-settings
      name: '@ft/dsh-fft-settings'
    # FTShare 公用底座。必须是全局行：preset 内 `provide` 会抛
    # "Preset services require isolate realms"，而加上 isolate 之后服务变成 preset
    # 私有、preset 之外的插件 inject 不到。工具与投影钩子在 preset（见下）。
    - id: dsh-fft-ftshare
      name: '@ft/dsh-fft-ftshare'
    - id: newapi-wechat-sso
      name: '@ft/dsh-newapi-wechat-sso'
      config:
        baseUrl: https://llm-proxy.ftai.chat
        redirectUri: https://llm-proxy.ftai.chat/oauth/ft-sso
    - id: dsh-kline-sidebar
      name: '@ftshare-lab/dsh-kline'
    # Carrier only: the bare package name is what DSH's browser module scan can
    # see, so this row is what composes the cockpit's report card, session
    # "报告" view and sidebar tab. It registers no tools (see src/index.ts).
    - id: ft-research-cockpit
      name: '@ft/dsh-fft-research-cockpit'
    - id: preset-ft-finance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ft-finance
        name: 金融模式
        description: 金融研究与盯盘：行情指标、投研报告、因子评测。试试「深入研究一下贵州茅台」「今天涨停集中在哪些板块」「如何评估一个因子」
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: 你是非凸(FT)金融助手，帮助用户获取金融信息，进行金融研究。乐于助人，语言精准客观
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: ft-guidance
            name: '@ft/dsh-fft-settings/agent'
          - id: mcp-dsh-kline
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: dsh-kline
              transport: stdio
              command: !!js process.execPath
              args:
                - scripts/run-dsh-kline.mjs
              cwd: !!js String(process.env.DSH_KLINE_PACKAGE_ROOT || '').trim() || ((process.platform === 'win32' && /^\/[A-Za-z]:\//.test(decodeURIComponent(new URL('./node_modules/@ftshare-lab/dsh-kline/', ctx.baseUrl).pathname)) && decodeURIComponent(new URL('./node_modules/@ftshare-lab/dsh-kline/', ctx.baseUrl).pathname).slice(1)) || decodeURIComponent(new URL('./node_modules/@ftshare-lab/dsh-kline/', ctx.baseUrl).pathname))
              env:
                DSH_KLINE_HOST_PID: !!js String(process.pid)
                DSH_KLINE_DEFER_BOOTSTRAP: '1'
                DSH_KLINE_PYTHON: !!js process.env.DSH_KLINE_PYTHON || ''
                DSH_KLINE_VENV: !!js process.env.DSH_KLINE_VENV || ''
                DSH_KLINE_CACHE_DIR: !!js process.env.DSH_KLINE_CACHE_DIR || ''
                DSH_KLINE_RUNTIME_DIR: !!js process.env.DSH_KLINE_RUNTIME_DIR || ''
                DSH_KLINE_RUNTIME_MODE: !!js process.env.DSH_KLINE_RUNTIME_MODE || 'auto'
                DSH_KLINE_CHART_HOST: !!js process.env.DSH_KLINE_CHART_HOST || '127.0.0.1'
                DSH_KLINE_CHART_PORT: !!js process.env.DSH_KLINE_CHART_PORT || '8765'
                FTSHARE_SDK_SRC: !!js process.env.FTSHARE_SDK_SRC || ''
                FTSHARE_API_KEY: !!js process.env.FTSHARE_API_KEY || ''
                FTSHARE_API_KEY_FILE: !!js process.env.FTSHARE_API_KEY_FILE || ''
              toolCallTimeoutMs: 120000
              # A fresh Python environment can outlast the MCP SDK's fixed 60 s
              # discovery timeout. Let the launcher's detached bootstrap finish and
              # let reconnect attach the tools, rather than aborting DSH Web itself.
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10
          - id: ft-research-cockpit-tools
            name: '@ft/dsh-fft-research-cockpit/agent'
          - id: ft-ftshare-tools
            name: '@ft/dsh-fft-ftshare/tools'
          # P7/P8 的修复本体：把 dsh-kline 摘要式 MCP 工具藏在 structuredContent
          # 里的明细投影回模型可见文本，并把「没有数据 / 无权限 / 取数失败」三态
          # 分开说。钩子按 exec.agent 作用域生效，因此只影响金融模式。
          - id: ft-ftshare-project
            name: '@ft/dsh-fft-ftshare/project'
          - id: dsh-fft-factor-intake-standard
            name: '@ft/dsh-fft-factor-intake-standard'

- id: agent-preset-registry
  config:
    default: ft-finance
