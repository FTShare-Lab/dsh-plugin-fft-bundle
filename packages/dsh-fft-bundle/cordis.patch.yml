# dsh-fft-bundle patch layer: inserts the FT workbench plugin rows with their
# shared defaults. Applied when this package is installed via
#
#   dsh plugin --profile <name> add @dsh-ft/dsh-fft-finance-toolkit
#
# Two planes:
#   * the host rows (settings service, SSO, kline sidebar) stay global — a
#     service provider cannot be mounted from a preset, and client halves live
#     in the profile's browser module graph;
#   * everything that is only true in the finance working mode goes into
#     `preset-ft-finance`: the FT persona, the prompt contract entry, the
#     kline MCP client and the FTShare tool surface. That preset copies the
#     official `standard` composition, because a preset's `plugins` list is
#     complete and inherits nothing.
#
# The preset's tool registrations are scoped to the preset subtree, so the
# standard mode keeps none of them. That is what keeps `ftshare_*` and
# the projection hook out of the standard mode: the FTShare service row is
# global because a `provide` cannot live in a preset, while everything that
# registers a tool or a hook is mounted from `preset-ft-finance`.
#
# Last: make `ft-finance` the default new-session preset. The registry resolves
# `selectedDefault` first, but that field is volatile and never reaches disk, so
# the durable default is this row's `default`. Overriding the row replaces its
# whole config — the official row carries only `default` today, and
# `tests/preset-ft-finance.test.mjs` fails if that changes.

- insert:
    - id: dsh-fft-settings
      name: '@dsh-ft/dsh-fft-settings'
    # FTShare 公用底座。必须是全局行：preset 内 `provide` 会抛
    # "Preset services require isolate realms"，而加上 isolate 之后服务变成 preset
    # 私有、preset 之外的插件 inject 不到。工具与投影钩子在 preset（见下）。
    - id: dsh-fft-ftshare
      name: '@dsh-ft/dsh-fft-ftshare'
    - id: dsh-kline-sidebar
      name: '@ftshare-lab/dsh-kline'
    # 模拟盘：一行同时承载宿主半（RPC 路由与 paper_stock_* / paper_futures_* /
    # paper_ledger 工具）与浏览器半（侧栏「模拟交易」标签）。bare-name 全局行是 DSH
    # 浏览器模块扫描唯一能看到的形态，不能放进 preset（preset 行不产生浏览器模块源）。
    # 它从依赖取得本包（registry 上的精确版本），因此本行必须与 package.json 的
    # @dsh-ft/dsh-fft-paper-trading 钉版成对存在。
    - id: ft-paper-trading
      name: '@dsh-ft/dsh-fft-paper-trading'
    - id: preset-ft-finance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ft-finance
        name: 金融模式
        description: 金融研究与盯盘：行情指标、K 线与 FTShare 数据面。试试「贵州茅台最近走势」「今天涨停集中在哪些板块」「用 ftshare 查一下这只票的现金流」
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # No suffix on purpose. DSH 0.2.1 assembles prompt variables
              # strictly and registers only `provider` / `model` (agent-loop), so
              # the old working-directory clause failed step 1 with "unknown
              # prompt variable". The working-directory service supplies the
              # directory as runtime context instead.
              # persona 只负责**触发**：告诉模型"什么时候该去加载绘图 skill"。
              # 具体怎么画（产物路径、是否用 present、哪些情形不画、图文比例）全部
              # 写在 skill 正文里——那些规则只在画图时成立，塞进每轮注入的 persona
              # 会平白占用上下文，也会让不适用的任务被这些措辞带偏。
              prefix: |-
                你是非凸(FT)金融助手，帮助用户获取金融信息，进行金融研究。乐于助人，语言精准客观
                ## 数据出图
                FTShare 接口取到的数据，只要涉及时间趋势、横截面排名、分布或对比，就应出图；图比表格更容易看出形态。
                出图前先加载 skill `dsh-fft-plot` 并按其说明执行。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            # Host default since 0.2.2: the dedicated apply_patch tool is off.
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 0.2.1 registers list_agents only as this subpath; 0.2.2 inlined it
              # into the entry above and dropped the subpath. Mounting a missing
              # row fails the whole preset mount, so mount it only when the entry
              # does not already register the tool.
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
                disabled: !!js process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.resourcesPath, 'app.asar', 'dsh', 'node_modules', '@deepseek-ai', 'dsh-tool-subagent-control', 'lib', 'index.js'), 'utf8').includes('list_agents')
              # Model selection follows the 0.2.2 host: the spawn tool exposes
              # the optional route fields and owns `list_subagent_models`, the
              # fork tool keeps both off to preserve inherited-prefix reuse.
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            # Declared for parity with the host composition; inert here because
            # this package cannot resolve its row from the preset's base URL.
            disabled: true
          - id: ft-guidance
            name: '@dsh-ft/dsh-fft-settings/agent'
          - id: mcp-dsh-kline
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: dsh-kline
              transport: stdio
              # Not upstream's row verbatim: `cwd` is this package's own
              # directory — the profile's `cordis.yml` sits next to it in every
              # layout — and `scripts/kline-mcp.mjs` resolves kline from there.
              # `args[0]` is relative to `cwd`, and pointing `cwd` at kline (or
              # at DSH_KLINE_PACKAGE_ROOT) is what broke tarball installs, which
              # nest kline inside this package. See tests/kline-rows.test.mjs.
              command: !!js process.execPath
              args:
                - scripts/kline-mcp.mjs
              cwd: !!js ((process.platform === 'win32' && /^\/[A-Za-z]:\//.test(decodeURIComponent(new URL('./node_modules/@dsh-ft/dsh-fft-finance-toolkit/', ctx.baseUrl).pathname)) && decodeURIComponent(new URL('./node_modules/@dsh-ft/dsh-fft-finance-toolkit/', ctx.baseUrl).pathname).slice(1)) || decodeURIComponent(new URL('./node_modules/@dsh-ft/dsh-fft-finance-toolkit/', ctx.baseUrl).pathname))
              env:
                DSH_KLINE_HOST_PID: !!js String(process.pid)
                DSH_KLINE_DEFER_BOOTSTRAP: '1'
                # The host's own value has to travel explicitly: the MCP client
                # scrubs every `DSH_*` name out of the child environment, so the
                # shim can only honor the documented override if the row passes
                # it on.
                DSH_KLINE_PACKAGE_ROOT: !!js process.env.DSH_KLINE_PACKAGE_ROOT || ''
                DSH_KLINE_PYTHON: !!js process.env.DSH_KLINE_PYTHON || ''
                DSH_KLINE_VENV: !!js process.env.DSH_KLINE_VENV || ''
                DSH_KLINE_CACHE_DIR: !!js process.env.DSH_KLINE_CACHE_DIR || ''
                DSH_KLINE_RUNTIME_DIR: !!js process.env.DSH_KLINE_RUNTIME_DIR || ''
                DSH_KLINE_RUNTIME_MODE: !!js process.env.DSH_KLINE_RUNTIME_MODE || 'auto'
                DSH_KLINE_CHART_HOST: !!js process.env.DSH_KLINE_CHART_HOST || '127.0.0.1'
                DSH_KLINE_CHART_PORT: !!js process.env.DSH_KLINE_CHART_PORT || '8765'
                FTSHARE_SDK_SRC: !!js process.env.FTSHARE_SDK_SRC || ''
                FTSHARE_API_KEY: !!js process.env.FTSHARE_API_KEY || ''
                FTSHARE_API_KEY_FILE: !!js process.env.FTSHARE_API_KEY_FILE || ''
              toolCallTimeoutMs: 120000
              # A fresh Python environment can outlast the MCP SDK's fixed 60 s
              # discovery timeout. Let the launcher's detached bootstrap finish and
              # let reconnect attach the tools, rather than aborting DSH Web itself.
              failOnStartupError: false
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 10
          - id: ft-ftshare-tools
            name: '@dsh-ft/dsh-fft-ftshare/tools'
          # kline 的 FTShare wrapper 工具（market_pulse / market_board_detail /
          # security_intelligence）不再下发给模型：替代能力走 ftshare_* 与
          # ftshare_call。掩码落到每个 agent 自己的 layer，随 agent 销毁解除，
          # 因此标准模式与 kline 侧边栏、图表一律不受影响。
          - id: ft-ftshare-mask
            name: '@dsh-ft/dsh-fft-ftshare/mask'
          # P7/P8 的修复本体：把 dsh-kline 摘要式 MCP 工具藏在 structuredContent
          # 里的明细投影回模型可见文本，并不再输出裸计数。钩子按 exec.agent 作用域
          # 生效，因此只影响金融模式。
          - id: ft-ftshare-project
            name: '@dsh-ft/dsh-fft-ftshare/project'
          # 把取数结果画成内联 SVG。随包分发一个 skill，模型按 persona 的
          # 触发语加载它；脚本只用 Python 标准库，不引入任何第三方依赖。
          # 挂在 preset 内：只有金融模式的 agent 能看到这个 skill。
          - id: dsh-fft-plot
            name: '@dsh-ft/dsh-fft-plot'

- id: agent-preset-registry
  config:
    default: ft-finance
